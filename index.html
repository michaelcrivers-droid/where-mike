<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Both declared on purpose. The SVG is what modern browsers use; the ICO
      exists because a browser that finds no usable declared icon falls back to
      probing /favicon.ico, and that probe is the one 404 the console shows.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f4f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="A fictional location-sharing demo. Every place it shows is made up."
    />
    <title>WhereMike</title>
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
